# FMToolkit CI — add this file to your repo at:
# .github/workflows/fmtoolkit-ci.yml
#
# Then set the FMTOOLKIT_API_KEY secret in your repository settings.

name: FMToolkit CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Required: a called reusable workflow can never have more permissions than
# the caller grants it, regardless of what the reusable workflow itself
# declares. Without this block, repos using GitHub's restricted default
# token permissions (read-only contents, nothing else) will fail on the
# very first run with "workflow is requesting 'pull-requests: write', but
# is only allowed 'pull-requests: none'" before any job even starts.
permissions:
  contents: read
  pull-requests: write

jobs:
  fmtoolkit:
    uses: URSA-Inc/fmtoolkit-public/.github/workflows/fmtoolkit-ci-reusable.yml@v1
    secrets:
      fmtoolkit_api_key: ${{ secrets.FMTOOLKIT_API_KEY }}
    with:
      # File extensions to check — edit to match your codebase
      file_patterns: "**/*.py"

      # How to treat each result type:
      #   "fail"  — marks the check failed (blocks merge if required)
      #   "warn"  — shows in the summary but does not fail the check
      #   "pass"  — silently ignored
      on_not_equivalent: "fail"   # always fail on counterexamples
      on_inconclusive:   "warn"   # FMToolkit ran but couldn't determine equivalence
      on_skipped:        "pass"   # function could not be analyzed
      on_error:          "warn"   # internal FMToolkit error

      # Per-function analysis timeout in seconds
      timeout: 30

