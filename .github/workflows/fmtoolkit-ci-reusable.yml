# FMToolkit reusable workflow — called by customer repos via fmtoolkit-ci.yml.

name: FMToolkit Reusable CI

on:
  workflow_call:
    secrets:
      fmtoolkit_api_key:
        required: true
    inputs:
      file_patterns:
        type: string
        default: "**/*.py **/*.ts **/*.tsx"
      on_not_equivalent:
        type: string
        default: "fail"
      on_inconclusive:
        type: string
        default: "warn"
      on_skipped:
        type: string
        default: "pass"
      on_error:
        type: string
        default: "warn"
      timeout:
        type: number
        default: 30

permissions:
  contents: read
  pull-requests: write

jobs:
  fmtoolkit-verify:
    name: FMToolkit Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: ${{ inputs.file_patterns }}

      - name: Run FMToolkit verification
        id: fmtoolkit
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          FMTOOLKIT_API_KEY: ${{ secrets.fmtoolkit_api_key }}
          ON_NOT_EQUIVALENT: ${{ inputs.on_not_equivalent }}
          ON_INCONCLUSIVE: ${{ inputs.on_inconclusive }}
          ON_SKIPPED: ${{ inputs.on_skipped }}
          ON_ERROR: ${{ inputs.on_error }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          pip install requests --quiet
          python - << 'INNEREOF'
          import json, os, subprocess, sys, requests

          # The files that define the ancestors of a changed file's classes
          # (every base of every ancestor) and the classes their fields name,
          # at both commits: the engine analyzes the file with them, so a class
          # whose base is in another file of the repository isn't declined
          # (FMT-2.0 #1288). At most 20 files and 1 MB; the engine declines a
          # class whose ancestry isn't complete in what's sent.
          import ast as _ast

          _CTX_MAX_FILES, _CTX_MAX_BYTES = 20, 1_000_000

          def _ctx_module(path):
              p = path.replace("\\", "/")
              p = p[2:] if p.startswith("./") else p
              p = p[4:] if p.startswith("src/") else p
              parts = [s for s in (p[:-3] if p.endswith(".py") else p).split("/") if s]
              return ".".join(parts[:-1] if parts and parts[-1] == "__init__" else parts)

          def _ctx_file(module):
              for root in (".", "src"):
                  base = os.path.join(root, *module.split("."))
                  for cand in (base + ".py", os.path.join(base, "__init__.py")):
                      if os.path.isfile(cand):
                          return os.path.normpath(cand)
              return None

          def _ctx_absolute(module, level, current, is_pkg):
              if level == 0:
                  return module or ""
              parts = current.split(".")
              drop = level - 1 if is_pkg else level
              parts = parts[: len(parts) - drop] if drop <= len(parts) else []
              return ".".join([*parts, module] if module else parts)

          def _ctx_imports(tree, current, is_pkg):
              out = {}
              for s in tree.body:
                  if isinstance(s, _ast.ImportFrom):
                      mod = _ctx_absolute(s.module, s.level, current, is_pkg)
                      for a in s.names:
                          out[a.asname or a.name] = (mod, a.name)
                  elif isinstance(s, _ast.Import):
                      for a in s.names:
                          out[a.asname or a.name.split(".")[0]] = (a.name if a.asname else a.name.split(".")[0], None)
              return out

          def _ctx_wanted(src, path):
              # (module, name) of each class a file's classes inherit or annotate fields with, imported.
              try:
                  tree = _ast.parse(src)
              except SyntaxError:
                  return set()
              imports = _ctx_imports(tree, _ctx_module(path), path.endswith("__init__.py"))
              wanted = set()
              for cls in [n for n in tree.body if isinstance(n, _ast.ClassDef)]:
                  exprs = list(cls.bases)
                  for n in _ast.walk(cls):
                      if isinstance(n, _ast.AnnAssign):
                          exprs.append(n.annotation)
                      elif isinstance(n, _ast.arg) and n.annotation is not None:
                          exprs.append(n.annotation)
                  for e in exprs:
                      for n in _ast.walk(e):
                          if isinstance(n, _ast.Name) and n.id in imports and imports[n.id][1]:
                              wanted.add(imports[n.id])
                          elif (isinstance(n, _ast.Attribute) and isinstance(n.value, _ast.Name)
                                and n.value.id in imports and imports[n.value.id][1] is None):
                              wanted.add((imports[n.value.id][0], n.attr))
              return wanted

          def _ctx_versions(path, base_sha):
              try:
                  head = open(path).read()
              except (FileNotFoundError, UnicodeDecodeError):
                  head = ""
              r = subprocess.run(["git", "show", f"{base_sha}:{path}"], capture_output=True, text=True)
              return (r.stdout if r.returncode == 0 else ""), head

          def _context_files(fp, src_base, src_head, base_sha):
              todo = list(_ctx_wanted(src_base, fp) | _ctx_wanted(src_head, fp))
              seen, sent, size = set(), {}, 0
              while todo:
                  mod, name = todo.pop()
                  if (mod, name) in seen:
                      continue
                  seen.add((mod, name))
                  path = _ctx_file(mod)
                  if path is None or os.path.normpath(path) == os.path.normpath(fp):
                      continue            # outside the repository (a library), or the file itself
                  if path not in sent:
                      vb, vh = _ctx_versions(path, base_sha)
                      if len(sent) >= _CTX_MAX_FILES or size + len(vb) + len(vh) > _CTX_MAX_BYTES:
                          continue        # past the cap: the engine declines what this leaves incomplete
                      sent[path] = {"path": path, "module": _ctx_module(path), "source_base": vb, "source_head": vh}
                      size += len(vb) + len(vh)
                  for version in (sent[path]["source_base"], sent[path]["source_head"]):
                      todo.extend(_ctx_wanted(version, path))
                      # A re-export (`from .app import App` in a package's __init__) leads on.
                      try:
                          tree = _ast.parse(version)
                      except SyntaxError:
                          continue
                      imports = _ctx_imports(tree, _ctx_module(path), path.endswith("__init__.py"))
                      if name in imports and imports[name][1]:
                          todo.append(imports[name])
              return list(sent.values())

          api_key  = os.environ["FMTOOLKIT_API_KEY"]
          api_url  = "https://api-ca.ursasecure.com"
          timeout  = int(os.environ.get("TIMEOUT", "60"))
          policy = {
              "not_equivalent": os.environ.get("ON_NOT_EQUIVALENT", "fail"),
              "inconclusive":   os.environ.get("ON_INCONCLUSIVE",   "warn"),
              "skipped":        os.environ.get("ON_SKIPPED",        "pass"),
              "error":          os.environ.get("ON_ERROR",          "warn"),
          }
          changed_files = """${{ steps.changed-files.outputs.all_changed_files }}""".split()
          base_sha = "${{ github.event.pull_request.base.sha || github.event.before }}"
          head_sha = "${{ github.sha }}"
          base_ref = "${{ github.event.pull_request.base.ref || 'base' }}"

          all_results, errors = [], []
          for fp in changed_files:
              try:
                  src_head = open(fp).read()
              except FileNotFoundError:
                  src_head = ""
              r = subprocess.run(["git", "show", f"{base_sha}:{fp}"], capture_output=True, text=True)
              src_base = r.stdout if r.returncode == 0 else ""
              if not src_base and not src_head:
                  continue
              print(f"Checking {fp} ...")
              # Python only: the classes a TypeScript file inherits aren't sent yet.
              ctx = _context_files(fp, src_base, src_head, base_sha) if fp.endswith(".py") else []
              try:
                  resp = requests.post(
                      f"{api_url}/v1/ci",
                      headers={"Authorization": f"Bearer {api_key}"},
                      json={
                          "file_path":   fp,
                          "source_base": src_base,
                          "source_head": src_head,
                          "base_ref":    base_ref,
                          "head_ref":    head_sha[:8],
                          "config":      {"timeout": timeout},
                          **({"context_files": ctx} if ctx else {}),
                      },
                      timeout=timeout + 10,
                  )
              except (requests.Timeout, requests.RequestException) as e:
                  print(f"  {fp}: FMToolkit not currently available ({e})")
                  errors.append(f"{fp}: FMToolkit not currently available")
                  continue
              if resp.status_code == 408:
                  print(f"  {fp}: FMToolkit not currently available (timeout)")
                  errors.append(f"{fp}: FMToolkit not currently available")
                  continue
              if resp.status_code != 200:
                  print(f"  {fp}: API error {resp.status_code}: {resp.text[:200]}")
                  errors.append(f"{fp}: API error {resp.status_code}: {resp.text[:200]}")
                  continue
              report = resp.json()
              for fn in report.get("results", []):
                  print(f"  {fn['name']}: {fn['status']}"
                        + (f" counterexample={fn['counterexample']}" if fn.get("counterexample") else ""))
              all_results.append(report)

          with open("fmtoolkit_results.json", "w") as f:
              json.dump({"results": all_results, "errors": errors, "policy": policy}, f)

          exit_code = 0
          for report in all_results:
              for fn in report.get("results", []):
                  if policy.get(fn.get("status"), "pass") == "fail":
                      exit_code = 1
          if errors:
              print(f"\n{len(errors)} file(s) had errors: {errors}")
          print(f"\nExiting {exit_code} ({'policy failure' if exit_code else 'success'})")
          sys.exit(exit_code)
          INNEREOF

      - name: Post FMToolkit summary
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            let data = { results: [], errors: [], policy: {} };
            try { data = JSON.parse(fs.readFileSync('fmtoolkit_results.json', 'utf8')); } catch(e) {}
            const passed = '${{ steps.fmtoolkit.outcome }}' !== 'failure';
            const EMOJI = { equivalent:'✅', not_equivalent:'❌', inconclusive:'⚠️', skipped:'⬜', error:'🔴', intentional:'✅', timeout:'⚠️' };
            let body = passed
              ? '## ✅ FMToolkit — all changed functions verified\n'
              : '## ❌ FMToolkit found differences — review required\n';

            for (const report of data.results) {
              const results = report.results || [];
              const s = report.summary || {};
              const changed = results.filter(f => !['unchanged', 'added', 'deleted'].includes(f.status));

              body += `\n### \`${report.file}\`\n\n`;
              body += `New: **${s.added ?? 0}**  ·  Removed: **${s.deleted ?? 0}**  ·  Unchanged: **${s.unchanged ?? 0}**  ·  Changed: **${changed.length}**\n\n`;

              // Breakdown of changed functions, in the order that matters most first.
              // Only show categories that actually occur, plus the four core ones always.
              const core = [
                ['equivalent',     '✅ Equivalent'],
                ['not_equivalent', '❌ Not equivalent'],
                ['inconclusive',   '⚠️ Inconclusive'],
                ['skipped',        '⬜ Not analyzable'],
              ];
              const extra = [
                ['intentional', '✅ Intentional change'],
                ['timeout',     '⚠️ Timeout'],
                ['error',       '🔴 Error'],
              ];
              const parts = core.map(([k, label]) => `${label}: ${s[k] ?? 0}`);
              for (const [k, label] of extra) {
                if (s[k]) parts.push(`${label}: ${s[k]}`);
              }
              body += parts.join('  ·  ') + '\n';

              if (changed.length) {
                body += '\n**Changed functions:**\n\n';
                for (const fn of changed) {
                  const e = EMOJI[fn.status] || '⚪';
                  let line = `${e} **${fn.name}** — ${fn.status.replace(/_/g, ' ')}`;
                  if (fn.confidence != null) line += ` (confidence: ${fn.confidence.toFixed(2)})`;
                  body += line + '\n';
                  if (fn.counterexample) {
                    body += '```\nCounterexample:\n';
                    for (const [k, v] of Object.entries(fn.counterexample)) body += `  ${k} = ${JSON.stringify(v)}\n`;
                    body += '```\n';
                  }
                  if (fn.skip_reason) body += `  _(skip reason: ${fn.skip_reason})_\n`;
                  if (fn.errors && fn.errors.length) {
                    for (const err of fn.errors) body += `  _(${err})_\n`;
                  }
                }
              }
            }

            for (const e of data.errors || []) body += `\n⚠️ ${e}\n`;
            if (!data.results.length && !(data.errors || []).length) {
              body += '\nNo files matched the configured file_patterns in this PR.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.trim(),
            });

