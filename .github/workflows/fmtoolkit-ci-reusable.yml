# FMToolkit reusable workflow — called by customer repos via fmtoolkit-ci.yml.

name: FMToolkit Reusable CI

on:
  workflow_call:
    secrets:
      fmtoolkit_api_key:
        required: true
    inputs:
      file_patterns:
        type: string
        default: "**/*.py **/*.ts **/*.tsx"
      on_not_equivalent:
        type: string
        default: "fail"
      on_inconclusive:
        type: string
        default: "warn"
      on_skipped:
        type: string
        default: "pass"
      on_error:
        type: string
        default: "warn"
      timeout:
        type: number
        default: 30

permissions:
  contents: read
  pull-requests: write

jobs:
  fmtoolkit-verify:
    name: FMToolkit Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@2d756ea4c53f7f6b397767d8723b3a10a9f35bf2 # v44
        with:
          files: ${{ inputs.file_patterns }}

      - name: Run FMToolkit verification
        id: fmtoolkit
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          FMTOOLKIT_API_KEY: ${{ secrets.fmtoolkit_api_key }}
          ON_NOT_EQUIVALENT: ${{ inputs.on_not_equivalent }}
          ON_INCONCLUSIVE: ${{ inputs.on_inconclusive }}
          ON_SKIPPED: ${{ inputs.on_skipped }}
          ON_ERROR: ${{ inputs.on_error }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          pip install requests --quiet
          python - << 'INNEREOF'
          import json, os, subprocess, sys, requests

          api_key  = os.environ["FMTOOLKIT_API_KEY"]
          api_url  = "https://api-ca.ursasecure.com"
          timeout  = int(os.environ.get("TIMEOUT", "60"))
          policy = {
              "not_equivalent": os.environ.get("ON_NOT_EQUIVALENT", "fail"),
              "inconclusive":   os.environ.get("ON_INCONCLUSIVE",   "warn"),
              "skipped":        os.environ.get("ON_SKIPPED",        "pass"),
              "error":          os.environ.get("ON_ERROR",          "warn"),
          }
          changed_files = """${{ steps.changed-files.outputs.all_changed_files }}""".split()
          base_sha = "${{ github.event.pull_request.base.sha || github.event.before }}"
          head_sha = "${{ github.sha }}"
          base_ref = "${{ github.event.pull_request.base.ref || 'base' }}"

          all_results, errors = [], []
          for fp in changed_files:
              try:
                  src_head = open(fp).read()
              except FileNotFoundError:
                  src_head = ""
              r = subprocess.run(["git", "show", f"{base_sha}:{fp}"], capture_output=True, text=True)
              src_base = r.stdout if r.returncode == 0 else ""
              if not src_base and not src_head:
                  continue
              print(f"Checking {fp} ...")
              try:
                  resp = requests.post(
                      f"{api_url}/v1/ci",
                      headers={"Authorization": f"Bearer {api_key}"},
                      json={
                          "file_path":   fp,
                          "source_base": src_base,
                          "source_head": src_head,
                          "base_ref":    base_ref,
                          "head_ref":    head_sha[:8],
                          "config":      {"timeout": timeout},
                      },
                      timeout=timeout + 10,
                  )
              except (requests.Timeout, requests.RequestException) as e:
                  print(f"  {fp}: FMToolkit not currently available ({e})")
                  errors.append(f"{fp}: FMToolkit not currently available")
                  continue
              if resp.status_code == 408:
                  print(f"  {fp}: FMToolkit not currently available (timeout)")
                  errors.append(f"{fp}: FMToolkit not currently available")
                  continue
              if resp.status_code != 200:
                  print(f"  {fp}: API error {resp.status_code}: {resp.text[:200]}")
                  errors.append(f"{fp}: API error {resp.status_code}: {resp.text[:200]}")
                  continue
              report = resp.json()
              for fn in report.get("results", []):
                  print(f"  {fn['name']}: {fn['status']}"
                        + (f" counterexample={fn['counterexample']}" if fn.get("counterexample") else ""))
              all_results.append(report)

          with open("fmtoolkit_results.json", "w") as f:
              json.dump({"results": all_results, "errors": errors, "policy": policy}, f)

          exit_code = 0
          for report in all_results:
              for fn in report.get("results", []):
                  if policy.get(fn.get("status"), "pass") == "fail":
                      exit_code = 1
          if errors:
              print(f"\n{len(errors)} file(s) had errors: {errors}")
          print(f"\nExiting {exit_code} ({'policy failure' if exit_code else 'success'})")
          sys.exit(exit_code)
          INNEREOF

      - name: Post FMToolkit summary
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let data = { results: [], errors: [], policy: {} };
            try { data = JSON.parse(fs.readFileSync('fmtoolkit_results.json', 'utf8')); } catch(e) {}
            const passed = '${{ steps.fmtoolkit.outcome }}' !== 'failure';
            const EMOJI = { equivalent:'✅', not_equivalent:'❌', inconclusive:'⚠️', skipped:'⬜', error:'🔴', intentional:'✅', timeout:'⚠️' };
            let body = passed
              ? '## ✅ FMToolkit — all changed functions verified\n'
              : '## ❌ FMToolkit found differences — review required\n';

            for (const report of data.results) {
              const results = report.results || [];
              const s = report.summary || {};
              const changed = results.filter(f => !['unchanged', 'added', 'deleted'].includes(f.status));

              body += `\n### \`${report.file}\`\n\n`;
              body += `New: **${s.added ?? 0}**  ·  Removed: **${s.deleted ?? 0}**  ·  Unchanged: **${s.unchanged ?? 0}**  ·  Changed: **${changed.length}**\n\n`;

              // Breakdown of changed functions, in the order that matters most first.
              // Only show categories that actually occur, plus the four core ones always.
              const core = [
                ['equivalent',     '✅ Equivalent'],
                ['not_equivalent', '❌ Not equivalent'],
                ['inconclusive',   '⚠️ Inconclusive'],
                ['skipped',        '⬜ Not analyzable'],
              ];
              const extra = [
                ['intentional', '✅ Intentional change'],
                ['timeout',     '⚠️ Timeout'],
                ['error',       '🔴 Error'],
              ];
              const parts = core.map(([k, label]) => `${label}: ${s[k] ?? 0}`);
              for (const [k, label] of extra) {
                if (s[k]) parts.push(`${label}: ${s[k]}`);
              }
              body += parts.join('  ·  ') + '\n';

              if (changed.length) {
                body += '\n**Changed functions:**\n\n';
                for (const fn of changed) {
                  const e = EMOJI[fn.status] || '⚪';
                  let line = `${e} **${fn.name}** — ${fn.status.replace(/_/g, ' ')}`;
                  if (fn.confidence != null) line += ` (confidence: ${fn.confidence.toFixed(2)})`;
                  body += line + '\n';
                  if (fn.counterexample) {
                    body += '```\nCounterexample:\n';
                    for (const [k, v] of Object.entries(fn.counterexample)) body += `  ${k} = ${JSON.stringify(v)}\n`;
                    body += '```\n';
                  }
                  if (fn.skip_reason) body += `  _(skip reason: ${fn.skip_reason})_\n`;
                  if (fn.errors && fn.errors.length) {
                    for (const err of fn.errors) body += `  _(${err})_\n`;
                  }
                }
              }
            }

            for (const e of data.errors || []) body += `\n⚠️ ${e}\n`;
            if (!data.results.length && !(data.errors || []).length) {
              body += '\nNo files matched the configured file_patterns in this PR.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.trim(),
            });

